pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> 
    def npxCommand = []
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        npxCommand = ["npx.cmd", "@react-native-community/cli", "config"]
    } else {
        // Try to find npx in common locations if not in PATH
        def npxPath = "/usr/local/bin/npx"
        if (new File(npxPath).exists()) {
            npxCommand = [npxPath, "@react-native-community/cli", "config"]
        } else {
            npxCommand = ["npx", "@react-native-community/cli", "config"]
        }
    }
    // Include the installed native module metadata in the cache key. A dependency
    // can be installed after package.json was last changed, leaving stale links.
    def appRoot = settings.layout.rootDirectory.dir("../")
    def autolinkInputs = appRoot.files(
        "package.json",
        "package-lock.json",
        "yarn.lock",
        "react-native.config.js",
        "node_modules/@react-native-community/geolocation/package.json"
    )
    ex.autolinkLibrariesFromCommand(npxCommand, appRoot.asFile, autolinkInputs)
}
rootProject.name = 'schooldropottpickup'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
